<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録零號｜帝國内閣官報枢府</title><style>body{margin:0;background:#f5efdf;color:#29251f;font-family:serif;line-height:1.9}.head{padding:14px 20px;background:#182b25;color:#f6efdf}.sheet{max-width:760px;margin:36px auto;padding:28px;background:#fffaf0;border:1px solid #c8b58c}h1,h2{color:#782532}a{display:inline-block;padding:10px 14px;background:#203a31;color:#fff7e8}p{line-height:2}@media(max-width:600px){.sheet{margin:20px 12px;padding:20px}}</style></head><body><div class="head">日ノ本帝國｜帝國内閣官報枢府</div><main class="sheet"><p>INTER-AGENCY ARCHIVAL INQUIRY / STAGE II</p><h1>記録零號</h1><p>照合成立。四季廳、宮内廳、官報枢府の三つの記録は、同じ欠落文書を指していた。</p><h2>次の照合先</h2><p>宮内廳の人物記録検索に、欄外の一文「物が語る故、物語。」を入力せよ。開いた内部記録の「祭祀局」を閲覽し、公開目録に存在しない祭祀番号を探すこと。</p><a href="https://8fgb66gmt2-stack.github.io/-teikokukunaicho-offical-web-site/#archive">宮内廳・帝室記録院へ進む →</a><p><small>本記録は中間資料であり、原本の所在は未確定。</small></p><p><a href="./secret-investigation.html">調査起點へ戻る</a></p></main></body></html>
